name: Dishpatch
description: >-
  Dishpatch is a UK-based meal delivery service that partners with renowned chefs
  and restaurants to deliver restaurant-quality, finish-at-home meals nationwide.
  Operated by Dishpatch Ltd (part of the Waitrose family), the service curates
  seasonal menus from chefs such as Michel Roux, Rick Stein, Sabrina Ghayour,
  Jose Pizarro and Paul Ainsworth. Orders are placed a la carte rather than by
  subscription, delivered on Fridays in insulated, recyclable packaging via DPD,
  and arrive pre-prepared for simple finishing steps at home. A paid "Supper Club"
  membership adds free shipping, exclusive menus, early sale access and spending
  credits. Dishpatch operates a consumer e-commerce storefront and does not
  currently publish a public developer API or documentation surface.
